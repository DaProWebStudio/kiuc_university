{% extends 'base/base.html' %}
{% load static i18n %}

{% block title %}{{ process.title }}{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <header class="page-hero reveal">
            <div class="page-hero__eye">{% trans 'Учебный процесс' %}</div>
            <h1 class="page-hero__h">{{ process.title }}</h1>
        </header>

        <div class="page-layout">
            <ul class="file-list reveal">
                {% for item in process.files.all %}
                    <li>
                        <a href="{{ item.file.url }}">{{ item.title }}</a>
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</section>
{% endblock %}
